<div class="w-100 p-4 border-info border-1 border border-opacity-50 rounded-3 shadow">
  <h1>Cadastro de usuário</h1>
  <ngb-alert 
    *ngIf="status"
    [dismissible]="true"
    [type]="statusType" 
    (closed)="clear()"
  >
    {{ status }}
  </ngb-alert>
  <form [formGroup]="FormCadUser" (submit)="onSubmit()">
    <div class="mb-3">
      <label for="email" class="form-label">E-mail</label>
      <input type="email" id="email" class="form-control" formControlName="email">
      <div *ngIf="FormCadUser.controls.email.touched && FormCadUser.controls.email.errors && status" class="mt-3">
        
        <ngb-alert type="danger" [dismissible]="false" *ngIf="FormCadUser.controls.email.hasError('required')">
            Informe o seu e-mail
          </ngb-alert>
          
          <ngb-alert type="danger" [dismissible]="false" *ngIf="FormCadUser.controls.email.hasError('email')">
            Informe um e-mail válido
          </ngb-alert>
          
          <ngb-alert type="danger" [dismissible]="false" *ngIf="FormCadUser.controls.email.hasError('minlength')">
            O e-mail deve ter no mínimo 8 digitos
          </ngb-alert>
          
          <ngb-alert type="danger" [dismissible]="false" *ngIf="FormCadUser.controls.email.hasError('maxlength')">
            O e-mail deve ter no máximo 100 digitos
          </ngb-alert>

      </div>
    </div>
    <div class="mb-3">
      <label for="senha" class="form-label">Senha</label>
      <input type="password" id="senha" class="form-control" formControlName="senha">
      <div *ngIf="FormCadUser.controls.senha.touched && FormCadUser.controls.senha.errors" class="mt-3">
        
        <ngb-alert type="danger" [dismissible]="false" *ngIf="FormCadUser.controls.senha.hasError('required')">
          O campo senha deve ser informado
        </ngb-alert>
        
        <ngb-alert type="danger" [dismissible]="false" *ngIf="FormCadUser.controls.senha.hasError('minlength')">
          O senha deve ter no mínimo 6 digitos
        </ngb-alert>

        <ngb-alert type="danger" [dismissible]="false" *ngIf="FormCadUser.controls.senha.hasError('maxlength')">
          A senha deve ter no máximo 20 digitos
        </ngb-alert>

    </div>
    </div>
    <div class="d-flex justify-content-evenly">
      <button 
        type="submit"
        [disabled]="FormCadUser.invalid"
        class="btn btn-primary"
      >
        Cadastrar
      </button>
      <button 
        type="reset"
        class="btn btn-danger"
      >
        Limpar
      </button>
    </div>
  </form>
</div>

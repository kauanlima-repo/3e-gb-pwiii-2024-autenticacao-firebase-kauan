<div class="w-100 p-4 border-info border-1 border border-opacity-50 rounded-3 shadow">
  <h1>Login</h1>
  <form [formGroup]="FormLoginUser" (submit)="onSubmit()">
    <div class="mb-3">
      <label for="email" class="form-label">E-mail</label>
      <input type="email" id="email" class="form-control" formControlName="email">
      <div *ngIf="FormLoginUser.controls.email.touched && FormLoginUser.controls.email.errors" class="mt-3">
        
        <ngb-alert type="danger" [dismissible]="false" *ngIf="FormLoginUser.controls.email.hasError('required')">
            Informe o seu e-mail
          </ngb-alert>
          
          <ngb-alert type="danger" [dismissible]="false" *ngIf="FormLoginUser.controls.email.hasError('email')">
            Informe um e-mail válido
          </ngb-alert>
          
          <ngb-alert type="danger" [dismissible]="false" *ngIf="FormLoginUser.controls.email.hasError('minlength')">
            O e-mail deve ter no mínimo 8 digitos
          </ngb-alert>
          
          <ngb-alert type="danger" [dismissible]="false" *ngIf="FormLoginUser.controls.email.hasError('maxlength')">
            O e-mail deve ter no máximo 100 digitos
          </ngb-alert>

      </div>
    </div>
    <div class="mb-3">
      <label for="senha" class="form-label">Senha</label>
      <input type="password" id="senha" class="form-control" formControlName="senha">
      <div *ngIf="FormLoginUser.controls.senha.touched && FormLoginUser.controls.senha.errors" class="mt-3">
        
        <ngb-alert type="danger" [dismissible]="false" *ngIf="FormLoginUser.controls.senha.hasError('required')">
          O campo senha deve ser informado
        </ngb-alert>
        
        <ngb-alert type="danger" [dismissible]="false" *ngIf="FormLoginUser.controls.senha.hasError('minlength')">
          O senha deve ter no mínimo 6 digitos
        </ngb-alert>

        <ngb-alert type="danger" [dismissible]="false" *ngIf="FormLoginUser.controls.senha.hasError('maxlength')">
          A senha deve ter no máximo 20 digitos
        </ngb-alert>

    </div>
    </div>
    <div>
      <button 
        type="submit"
        [disabled]="FormLoginUser.invalid"
        class="btn btn-primary w-100"
      >
        Logar
      </button>
    </div>
  </form>
</div>
